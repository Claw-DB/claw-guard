[package]
name = "claw-guard"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "Security and policy engine for ClawDB"
authors = ["Tomiwa Adeyemi <adeyemitomiwa7@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/clawdb/claw-guard"
homepage = "https://github.com/clawdb/claw-guard"
keywords = ["clawdb", "security", "policy", "engine"]
categories   = ["database", "embedded"]
exclude      = ["/target", "*.pem", "*.key", "*.crt"]


[lib]
name = "claw_guard"
path = "src/lib.rs"

[[bin]]
name = "guard-server"
path = "src/bin/guard-server.rs"

[[bench]]
name = "guard_bench"
harness = false

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
prost = "0.14"
tonic-prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "chrono", "uuid", "json"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
blake3 = "1.5"
zeroize = { version = "1", features = ["derive"] }
dashmap = "6"
arc-swap = "1"
regex = "1.12"
pest = "2.8"
pest_derive = "2.8"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
lru = "0.18"
backoff = { version = "0.4", features = ["tokio"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
hex = "0.4"
toml = "1.1"
glob = "0.3"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
rstest = "0.26"
wiremock = "0.6"
criterion = { version = "0.8", features = ["async_tokio"] }
