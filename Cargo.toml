[package]
name = "claw-guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Security and policy engine for ClawDB"

[lib]
name = "claw_guard"
path = "src/lib.rs"

[[bin]]
name = "guard-server"
path = "src/bin/guard-server.rs"

[[bench]]
name = "guard_bench"
harness = false

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "chrono"] }
jsonwebtoken = "9"
blake3 = "1.5"
zeroize = { version = "1", features = ["derive"] }
dashmap = "6"
arc-swap = "1"
regex = "1.10"
pest = "2.7"
pest_derive = "2.7"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
lru = "0.12"
backoff = { version = "0.4", features = ["tokio"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
hex = "0.4"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
rstest = "0.21"
wiremock = "0.6"
criterion = { version = "0.5", features = ["async_tokio"] }
